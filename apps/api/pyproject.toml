[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaal-api"
version = "1.4.2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.7.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Live AI extraction providers. The fixture demo needs none of these.
ai = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "hypothesis>=6.100.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    # Only needed to regenerate fixtures/policy_suraksha_shield.pdf
    "reportlab>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint.per-file-ignores]
# Tests adjust sys.path / env before importing the app — imports can't be first.
"tests/*.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in default arguments by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Body"]
